<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic or Persian profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var seen = localStorage.getItem('gym_default_lang');
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    var rtl = null;
    for (var i = 0; i < list.length; i++) {
      var tag = (list[i] || '').slice(0, 2).toLowerCase();
      if (tag === 'ar' || tag === 'fa') { rtl = tag; break; }
    }
    var l = s.lang || seen || rtl || 'en';
    document.documentElement.lang = l;
    document.documentElement.dir = (l === 'ar' || l === 'fa') ? 'rtl' : 'ltr';
  } catch (e) {}

  // Early-fetch /api/config in parallel with JS bundles so a fresh device knows DEFAULT_LANG before first paint.
  try {
    if (!window.location.protocol.startsWith('cap') && !window.location.protocol.startsWith('file')) {
      var p = window.location.pathname || '/';
      var base = p.slice(0, p.lastIndexOf('/') + 1) || '/';
      var cfgUrl = base.replace(/\/$/, '') + '/api/config';
      window.__gymConfigPromise = fetch(cfgUrl, { cache: 'no-cache' })
        .then(function(r) { return r.ok ? r.json() : null })
        .catch(function() { return null });
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<title>openGym</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#0c0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="openGym">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
